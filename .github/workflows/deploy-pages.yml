name: Publish reading room

on:
  push:
    branches: [main]
    paths:
      - output/**
      - tools/prepare_pages.py
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  BUNDLE_TAG: v2026.10.22
  BUNDLE_NAME: market-survey-awards-2024-2026.zip
  BUNDLE_SHA256: 898010373dda828f3571510cdcd67215bfb63135c1bbe618480cfb25eec129e1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reading page
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Download original reading files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/reading-bundle"
          gh release download "$BUNDLE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$BUNDLE_NAME" \
            --dir "$RUNNER_TEMP/reading-bundle"
      - name: Verify and prepare full site
        run: |
          python3 tools/prepare_pages.py \
            --archive "$RUNNER_TEMP/reading-bundle/$BUNDLE_NAME" \
            --sha256 "$BUNDLE_SHA256"
      - name: Upload complete reading site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
